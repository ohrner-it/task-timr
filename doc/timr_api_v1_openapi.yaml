      enum:
        - user_name
    RecordingLockType:
      description: Whether the assigned User may record on the Task, and where the lock comes from. `recordable` allows recording; `locked_automatically` follows the Task's lock date; `locked_manually` and `unlocked_manually` are explicit overrides for this assignment.
      type: string
      enum:
        - recordable
        - locked_automatically
        - locked_manually
        - unlocked_manually
    BudgetPlanningType:
      type: string
      description: |
        corresponding to the chosen planning type some properties cannot be set:
          * none: no further budget properties can be set
          * user_hourly_rate: budget_hourly_rate cannot be set

        for the remaining two types all budget properties are supported
      enum:
        - none
        - task_hourly_rate
        - user_hourly_rate
        - fixed_price
    BudgetPlanningTypeRequest:
      type: string
      description: |
        corresponding to the chosen planning type some properties cannot be set:
          * none: no further budget properties can be set
          * user_hourly_rate: budget_hourly_rate cannot be set
          * inherited: budget settings are inherited from the parent task

        for the remaining two types all budget properties are supported
      enum:
        - none
        - task_hourly_rate
        - user_hourly_rate
        - fixed_price
        - inherited
    TaskToLeaderAssignment:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserPartial"
        automatically_assigned:
          type: boolean
      required:
        - user
        - automatically_assigned
    TaskToLeaderAssignmentsPage:
      allOf:
        - $ref: "#/components/schemas/PagingInformation"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TaskToLeaderAssignment"
          required:
            - data
    TaskToLeaderAssignmentsSortColumn:
      type: string
      description: Sort property for Task to Leader Assignments. `user_name` orders by the assigned User's last name, then first name.
      enum:
        - user_name
    TaskToTeamAssignment:
      type: object
      properties:
        team:
          $ref: "#/components/schemas/TeamPartial"
        automatically_assigned:
          type: boolean
      required:
        - team
        - automatically_assigned
    TaskToTeamAssignmentsPage:
      allOf:
        - $ref: "#/components/schemas/PagingInformation"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TaskToTeamAssignment"
          required:
            - data
    TaskToTeamAssignmentsSortColumn:
      description: Sort property for Task to Team Assignments. `team_name` orders by the assigned Team's name.
      type: string
      enum:
        - team_name
    ProjectTime:
      description: |
        One booking on a `task`, from `start` to `end`, optionally `billable`, with `break_times`, notes and locations.
      type: object
      properties:
        id:
          description: Unique identifier. Treat it as an opaque string.
          type: string
          example: 074e7048-9097-11eb-a8b3-0242ac130003
        start:
          $ref: "#/components/schemas/DateTime"
