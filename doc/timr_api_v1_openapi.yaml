        end_location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Location"
        start_platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Platform"
        end_platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Platform"
