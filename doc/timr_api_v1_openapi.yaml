components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            fieldValidation:
              summary: A field failed validation
              description: |
                The type names the category and `errors` breaks the failure down per field. One entry per violation.
              value:
                type: https://errors.timr.com/validation
                title: Bad Request
                status: 400
                detail: Request validation failed
                instance: /working-times
                timestamp: 2026-07-16T09:30:00Z
                trace_id: 3f9a1c7e5b2d48a1
                errors:
                  - type: https://errors.timr.com/validation/paused-working-time
                    field: break_times
                    detail: break_times must contain exactly one break time of type 'ongoing'
            rule:
              summary: A rule rejected the request as a whole
              description: |
                The type names the specific rule and `detail` carries its message in the request locale. There is no `errors` array, because the failure does not belong to a field.
              value:
                type: https://errors.timr.com/validation/end-time-required
                title: Bad Request
                status: 400
                detail: End time must be defined
                instance: /working-times/074e7048-9097-11eb-a8b3-0242ac130003
                timestamp: 2026-07-16T09:30:00Z
                trace_id: 5e8b03a2fc194d67
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: https://errors.timr.com/forbidden
            title: Forbidden
            status: 403
            instance: /working-times/074e7048-9097-11eb-a8b3-0242ac130003
            timestamp: 2026-07-16T09:30:00Z
            trace_id: 8c41b0d9e7a2465f
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: https://errors.timr.com/not-found
            title: Not Found
            status: 404
            detail: No working time exists with this identifier.
            instance: /working-times/074e7048-9097-11eb-a8b3-0242ac130003
            timestamp: 2026-07-16T09:30:00Z
            trace_id: b57e2f13c9d04a86
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: https://errors.timr.com/conflict/resource-outdated
            title: Conflict
            status: 409
            detail: The object was edited in the meantime, please reload and try again.
            instance: /working-times/074e7048-9097-11eb-a8b3-0242ac130003
            timestamp: 2026-07-16T09:30:00Z
            trace_id: 1d6c8ae4f0b34927
    UnprocessableContent:
      description: Unprocessable Content
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            referenceNotFound:
              summary: A referenced entity does not exist
              description: |
                The request is well formed, but one of the identifiers in it resolves to nothing. The `errors` entry names the entity and the field that carried it.
              value:
                type: https://errors.timr.com/reference-not-found
                title: Unprocessable Content
                status: 422
                detail: Referenced entity not found
                instance: /drive-logs
                timestamp: 2026-07-16T09:30:00Z
                trace_id: 6a2f9b71e83c4d50
                errors:
                  - type: https://errors.timr.com/reference-not-found/car
                    field: car_id
                    detail: Car not found
            rule:
              summary: A business rule rejected the request
              description: |
                The request is understood and refers to entities that exist, but recording it would break a rule of the account's configuration.
              value:
                type: https://errors.timr.com/validation/task-not-bookable
                title: Unprocessable Content
                status: 422
                detail: Task "Onboarding" is not bookable
                instance: /project-times
                timestamp: 2026-07-16T09:30:00Z
                trace_id: 9f4d1e70b83a26c5
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth2 authentication for the timr API. Use Client Credentials for machine-to-machine integrations in the client context, or Authorization Code with refresh tokens when the integration acts on behalf of a timr user. Unauthenticated responses advertise the API's RFC 9728 protected-resource metadata URL through the `WWW-Authenticate` header. The separate timr AuthServer publishes its OpenID Provider metadata at https://system.timr.com/id/.well-known/openid-configuration. Use this discovery document to obtain the current authorization and token endpoints instead of hardcoding them.
      flows:
        clientCredentials:
          tokenUrl: https://system.timr.com/id/oauth2/token
          scopes:
            openid: Authenticate the OAuth client.
            timrclient: Access timr data in the client context.
        authorizationCode:
          authorizationUrl: https://system.timr.com/id/oauth2/authorize
          tokenUrl: https://system.timr.com/id/oauth2/token
          scopes:
            openid: Authenticate the timr user.
            offline_access: Request a refresh token for continued access.
          x-usePkce: SHA-256
          x-scalar-redirect-uri: https://developer.timr.com/
  schemas:
    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details base members (`type`, `title`, `status`, `detail`, `instance`) — the common shape of all error response bodies.
      properties:
        type:
          type: string
          format: uri
          example: https://errors.timr.com/validation/end-time-required
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Concrete error message
        instance:
          type: string
          format: uri-reference
          example: /working-times/12345
      required:
        - type
        - title
        - status
    Error:
      description: |
        TIMR error response body, extending the Problem Details base with `timestamp`, `trace_id` and per-field `errors[]` for validation, binding, constraint, request-body deserialization, and reference-not-found errors. The semantic identifier is encoded in the `type` URI (e.g. `https://errors.timr.com/conflict/resource-outdated`).

        Slugs in the `type` URI are lowercase kebab-case: a top-level category (`validation`, `reference-not-found`, `conflict`, `forbidden`, `internal`) optionally followed by a specific sub-slug (`conflict/resource-outdated`, `validation/end-time-required`, `reference-not-found/user`).
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          properties:
            timestamp:
              type: string
              format: date-time
              example: 2026-05-25T09:42:11Z
            trace_id:
              type: string
              nullable: true
              example: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              type: array
              nullable: true
              items:
                $ref: "#/components/schemas/ErrorEntry"
          required:
            - timestamp
    ErrorEntry:
      type: object
      description: |
        Field-level or sub-error entry, shaped like a sub-ProblemDetail. The `type` URI identifies the specific constraint or sub-error category (e.g. `validation/not-null` for a Bean Validation `@NotNull`, `validation/paused-working-time` for a TIMR custom validator code, `validation/type-mismatch` for a value that does not fit its target type, `validation/unknown-property` for a property the resource does not declare, `reference-not-found/user` for a `MappingException`). `field` is the JSONPath of the offending property in the request body, rooted at `$` — array elements included. An error about a query parameter names it plainly instead, without the `$.` prefix.
      properties:
        type:
          type: string
          format: uri
          example: https://errors.timr.com/validation/paused-working-time
        field:
          type: string
          nullable: true
          example: $.break_times[0].duration
        detail:
          type: string
          example: break_times must contain exactly one break time of type 'ongoing'
      required:
        - type
        - detail
    Duration:
      type: object
      properties:
        type:
          nullable: false
          allOf:
            - $ref: "#/components/schemas/DurationType"
        minutes:
          type: integer
          format: int64
          example: 42
          description: |
            Net minutes of the recording. In case of type 'half_day' or 'full_day' these get calculated automatically, based on WorkTimeSchedule configured for User
        minutes_rounded:
          type: integer
          format: int64
          example: 45
          description: |
            Net minutes rounded to the default setting configured. In case of type 'half_day' or 'full_day' these get calculated automatically, based on WorkTimeSchedule configured for User
      required:
        - type
        - minutes
        - minutes_rounded
    DurationType:
      description: How the duration of a single recording is expressed. Not to be confused with `DurationUnit`, which states the unit a Working Time Type is recorded in.
      type: string
      enum:
        - minutes
        - full_day
        - half_day
    DateTime:
      type: string
      description: RFC 3339 date-time (ISO-8601)
      format: date-time
      example: 2021-07-16T09:20:00+01:00
    LocalDate:
      type: string
      description: RFC 3339 date (ISO-8601)
      format: date
      example: 2021-07-16
    MonthDay:
      type: string
      description: ISO 8601 month-day form (--MM-DD)
      pattern: ^--(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
      example: --05-20
    LocalTime:
      type: string
      description: time of day (ISO-8601)
      format: time
      example: 15:20
    BreakTime:
      type: object
      oneOf:
        - $ref: "#/components/schemas/BreakTimeManual"
        - $ref: "#/components/schemas/BreakTimeOngoing"
        - $ref: "#/components/schemas/BreakTimeAutomatic"
      discriminator:
        propertyName: type
        mapping:
          manual: "#/components/schemas/BreakTimeManual"
          ongoing: "#/components/schemas/BreakTimeOngoing"
          automatic: "#/components/schemas/BreakTimeAutomatic"
      properties:
        type:
          $ref: "#/components/schemas/BreakTimeType"
      required:
        - type
    BreakTimeUpdate:
      type: object
      example: |
        {
          "type" : "manual",
          "duration_minutes" : 50 
        }
      discriminator:
        propertyName: type
        mapping:
          manual: "#/components/schemas/BreakTimeManual"
          ongoing: "#/components/schemas/BreakTimeOngoing"
      properties:
        type:
          $ref: "#/components/schemas/BreakTimeType"
      required:
        - type
      oneOf:
        - $ref: "#/components/schemas/BreakTimeManual"
        - $ref: "#/components/schemas/BreakTimeOngoing"
    BreakTimeBase:
      type: object
      description: Members shared by every kind of break time, including the discriminator.
      properties:
        type:
          $ref: "#/components/schemas/BreakTimeType"
      required:
        - type
    BreakTimeManual:
      allOf:
        - $ref: "#/components/schemas/BreakTimeBase"
        - type: object
          example: |
            {
              "type": "manual",
              "duration_minutes": 20,
              "start": null,
              "end": null
            }
          properties:
            duration_minutes:
              type: integer
              format: int32
              example: 20
              description: Duration of break in minutes. Please make sure it matches the duration between 'start' and 'end' if the properties are also given.
            start:
              nullable: true
              example: 2021-07-16T09:30:00+01:00
              description: start and end are optional. To avoid discrepancies in the duration given in duration_minutes and the time between start and end the preferable way is to only provide duration_minutes.
              allOf:
                - $ref: "#/components/schemas/DateTime"
            end:
              nullable: true
              example: 2021-07-16T09:40:00+01:00
              description: start and end are optional. To avoid discrepancies in the duration given in duration_minutes and the time between start and end the preferable way is to only provide duration_minutes.
              allOf:
                - $ref: "#/components/schemas/DateTime"
          required:
            - duration_minutes
    BreakTimeOngoing:
      allOf:
        - $ref: "#/components/schemas/BreakTimeBase"
        - type: object
          example: |
            {
              "type": "ongoing",
              "start": "2021-07-16T17:50:00+01:00"
            }
          properties:
            start:
              $ref: "#/components/schemas/DateTime"
          required:
            - start
    BreakTimeAutomatic:
      allOf:
        - $ref: "#/components/schemas/BreakTimeBase"
        - type: object
          example: |
            {
              "type": "automatic",
              "duration_minutes": 60,
              "start": "2021-07-16T15:50:00+01:00"
              "end": "2021-07-16T16:50:00+01:00"
            }
          properties:
            duration_minutes:
              type: integer
              format: int32
              example: 15
              description: Duration of break in minutes
            start:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/DateTime"
            end:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/DateTime"
          required:
            - duration_minutes
            - start
            - end
    BreakTimeType:
      description: Kind of break. `manual` was entered by the user, `automatic` was deducted by timr, `ongoing` is a break that has started and not yet ended.
      type: string
      enum:
        - manual
        - ongoing
        - automatic
    UserPartial:
      type: object
      properties:
        id:
          description: Unique identifier. Treat it as an opaque string.
          type: string
        firstname:
          type: string
