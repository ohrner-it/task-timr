        - type: object
          required:
            - lat
            - lon
    Location:
      type: object
      properties:
        lat:
          description: Latitude in decimal degrees.
          type: number
          format: float
          nullable: true
          example: 48.2455964
        lon:
          description: Longitude in decimal degrees.
          type: number
          format: float
          nullable: true
          example: 13.0543811
        timestamp:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DateTime"
        formatted_address:
          type: string
          nullable: true
          example: Salzburger Straße 2, 5280 Braunau am Inn
        accuracy:
          description: Horizontal GPS accuracy in meters.
          type: number
          format: float
          nullable: true
          example: 12.5
      required:
        - lat
        - lon
        - accuracy
    Platform:
      description: Platform the entry was recorded on.
      type: string
      enum:
        - timr_web
        - timr_mobile
        - tour_mobile
        - timr_terminal
        - sync_api
        - timr_api
    WorkingTimeStatus:
      description: Processing state of a Working Time. `running` and `paused` mean the recording is still open; from `changeable` on it is closed and progressively locked down as it is approved, closed and archived.
      type: string
      example: changeable
      enum:
        - running
        - paused
        - changeable
        - locked
        - approved
        - closed
        - archived
    WorkScheduleModelType:
      description: How the target working time of the model is defined.
      type: string
      example: daily_target_hours
      enum:
        - daily_target_hours
        - normal_working_time
    DailyWorkSchedule:
      type: object
      properties:
        target_duration_minutes:
          type: integer
          format: int64
          example: 480
          description: value in minutes
        normal_working_times:
          type: array
          description: this property is always set, when the WorkScheduleModel is of type normal_working_time, in contrast when the WorkScheduleModel is of type daily_target_hours it is not set
          items:
            allOf:
              - $ref: "#/components/schemas/NormalWorkingTimes"
      required:
        - target_duration_minutes
    NormalWorkingTimes:
      type: object
      properties:
        start:
          type: string
          format: time
          nullable: true
        end:
          type: string
          format: time
          nullable: true
    WorkingTimeRules:
      type: object
      properties:
        id:
          description: Unique identifier. Treat it as an opaque string.
          type: string
          example: 074e7048-9097-11eb-a8b3-0242ac130003
        name:
          type: string
      required:
        - id
        - name
    WorkingTime:
      description: |
        One continuous stretch from `start` to `end`, classified by its `working_time_type`. Attendance entries carry `break_times`, locations and the platform they were recorded on; an entry derived from a multi-day absence links back to its `working_time_date_span`.
      type: object
      properties:
        id:
          description: Unique identifier. Treat it as an opaque string.
          type: string
          example: 074e7048-9097-11eb-a8b3-0242ac130003
        start:
          $ref: "#/components/schemas/DateTime"
        end:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DateTime"
        break_time_total_minutes:
          type: integer
          format: int32
          description: Read-only. Total break time in minutes. Values are calculated as an aggregate of other properties
        break_times:
          type: array
          example: |
            [
                {
                  "type": "manual",
                  "duration_minutes": 20,
                  "start": null,
                  "end": null
                },
                {
                    "type": "automatic",
                    "duration_minutes": 30,
                    "start": "2021-07-16T13:15:00+02:00",
                    "end": "2021-07-16T13:45:00+02:00"
                }
            ]
          items:
            $ref: "#/components/schemas/BreakTime"
        duration:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Duration"
        changed:
          type: boolean
        notes:
          nullable: true
          type: string
        user:
          $ref: "#/components/schemas/UserPartial"
        working_time_type:
          $ref: "#/components/schemas/WorkingTimeTypePartial"
        working_time_date_span:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WorkingTimeDateSpanPartial"
        start_location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Location"
        end_location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Location"
        start_platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Platform"
        end_platform:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Platform"
        last_modified:
          description: |
            Read-only. Automatically updated when the entity is persisted. RFC 3339 date-time (ISO-8601)
          allOf:
            - $ref: "#/components/schemas/DateTime"
        last_modified_by:
          description: |
            Read-only. The User who last modified the entry, or null if the change was not made in a user context.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserPartial"
        status:
          $ref: "#/components/schemas/WorkingTimeStatus"
        metadata:
          type: object
          nullable: true
          additionalProperties: true
      required:
        - id
        - start
        - end
        - break_time_total_minutes
        - break_times
        - duration
        - changed
        - notes
        - user
        - working_time_type
        - working_time_date_span
        - start_location
        - end_location
        - start_platform
        - end_platform
        - last_modified
        - last_modified_by
        - status
    WorkingTimesPage:
      allOf:
        - $ref: "#/components/schemas/PagingInformation"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkingTime"
          required:
            - data
    WorkingTimesSortColumn:
      type: string
      description: Sort property for Working Times.
      enum:
        - start
        - last_modified
    WorkingTimeUpsert:
      type: object
      properties:
        start:
          description: |
            For WorkingTimeTypes with `edit_unit` `days` or `half_days`, `start` must be midnight (00:00) and on the same day as `end`. RFC 3339 date-time (ISO-8601)
          allOf:
            - $ref: "#/components/schemas/DateTime"
        end:
          nullable: true
          example: 2021-07-16T10:02:00+01:00
          description: |
            For WorkingTimeTypes with `edit_unit` `days` or `half_days`, `end` must be midnight (00:00) and on the same day as `start`. RFC 3339 date-time (ISO-8601)
          allOf:
            - $ref: "#/components/schemas/DateTime"
        break_times:
          type: array
          items:
            $ref: "#/components/schemas/BreakTimeUpdate"
        duration_type:
          nullable: true
          description: Must be specified for WorkingTimeTypes with `edit_unit` `days` or `half_days` only
          allOf:
            - $ref: "#/components/schemas/DurationType"
        changed:
          type: boolean
        notes:
          type: string
          nullable: true
        working_time_type_id:
          type: string
        status:
          $ref: "#/components/schemas/WorkingTimeStatus"
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    WorkingTimeUpdate:
      allOf:
        - $ref: "#/components/schemas/WorkingTimeUpsert"
        - type: object
          properties:
            start_location:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocationUpdate"
            end_location:
              nullable: true
              example: null
              allOf:
                - $ref: "#/components/schemas/LocationUpdate"
    WorkingTimeCreate:
      allOf:
        - $ref: "#/components/schemas/WorkingTimeUpsert"
        - type: object
          properties:
            user_id:
              type: string
            start_location:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocationCreate"
            end_location:
              nullable: true
              example: null
              allOf:
                - $ref: "#/components/schemas/LocationCreate"
          required:
            - start
            - changed
            - user_id
            - working_time_type_id
            - status
    DeletedEntryWithMetadata:
      allOf:
        - $ref: "#/components/schemas/DeletedEntryPartial"
        - type: object
          properties:
            metadata:
              type: object
              nullable: true
              additionalProperties: true
    DeletedEntryWithMetadataPage:
      allOf:
        - $ref: "#/components/schemas/PagingInformation"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/DeletedEntryWithMetadata"
          required:
            - data
    ProjectTimeStatus:
      description: Processing state of a Project Time. `running` and `paused` mean the recording is still open; from `changeable` on it is closed and progressively locked down as it is approved, cleared, closed and archived.
      type: string
      example: changeable
      enum:
        - running
        - paused
        - changeable
        - locked
        - approved
        - cleared
        - closed
        - archived
    TaskPartial:
      type: object
      properties:
        id:
          description: Unique identifier. Treat it as an opaque string.
          type: string
        name:
          type: string
        breadcrumbs:
          description: Full path of the entry within its hierarchy, including its own name.
          type: string
        external_id:
          description: Identifier of the corresponding object in an external system. Set and owned by the client.
          type: string
          nullable: true
      required:
        - id
        - name
        - breadcrumbs
        - external_id
    Task:
      description: |
        A task, placed in the tree by `parent_task`, with the full path from the root in `breadcrumbs`. `bookable` and `billable` control recording and invoicing; `lock_date`, time windows and location constrain what may be recorded.
      allOf:
        - $ref: "#/components/schemas/TaskPartial"
        - type: object
          properties:
            parent_task:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/TaskPartial"
            description:
              type: string
              nullable: true
            description_external:
              type: string
              nullable: true
            bookable:
              type: boolean
            billable:
              type: boolean
            project_time_notes_required:
              type: boolean
            start_date:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            end_date:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            lock_date:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            earliest_start_time:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalTime"
            latest_end_time:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalTime"
            active_from:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            active_to:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            budget_inherited:
              type: boolean
            budget_planning_type:
              $ref: "#/components/schemas/BudgetPlanningType"
            budget_hours_planned:
              type: number
              nullable: true
            budget_hourly_rate:
              type: number
              nullable: true
            budget_planned:
              type: number
              nullable: true
            budget_include_non_billable_project_times:
              type: boolean
            location_inherited:
              type: boolean
            location:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/TaskLocation"
            location_restriction_radius_meters:
              type: integer
              format: int32
              nullable: true
            custom_field_1:
              type: string
              nullable: true
            custom_field_2:
              type: string
              nullable: true
            custom_field_3:
              type: string
              nullable: true
            metadata:
              type: object
              nullable: true
              additionalProperties: true
          required:
            - parent_task
            - description
            - description_external
            - bookable
            - billable
            - project_time_notes_required
            - start_date
            - end_date
            - active_from
            - active_to
            - custom_field_1
            - custom_field_2
            - custom_field_3
    TaskReduced:
      allOf:
        - $ref: "#/components/schemas/TaskPartial"
        - type: object
          properties:
            parent_task:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/TaskPartial"
            description:
              type: string
              nullable: true
            bookable:
              type: boolean
            billable:
              type: boolean
            project_time_notes_required:
              type: boolean
            lock_date:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            earliest_start_time:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalTime"
            latest_end_time:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalTime"
            active_from:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            active_to:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LocalDate"
            budget_planning_type:
              $ref: "#/components/schemas/BudgetPlanningType"
            location_inherited:
              type: boolean
            location:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/TaskLocation"
            location_restriction_radius_meters:
              type: integer
              format: int32
              nullable: true
            custom_field_1:
              type: string
              nullable: true
            custom_field_2:
              type: string
              nullable: true
            custom_field_3:
              type: string
              nullable: true
          required:
            - parent_task
            - description
            - bookable
            - billable
            - project_time_notes_required
            - active_from
            - active_to
            - custom_field_1
            - custom_field_2
            - custom_field_3
    TasksPage:
      allOf:
        - $ref: "#/components/schemas/PagingInformation"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Task"
          required:
            - data
    TasksReducedPage:
      allOf:
        - $ref: "#/components/schemas/PagingInformation"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TaskReduced"
          required:
            - data
    TaskCreate:
      allOf:
        - $ref: "#/components/schemas/TaskBase"
        - type: object
          required:
            - name
            - bookable
            - billable
    TaskUpdate:
      allOf:
        - $ref: "#/components/schemas/TaskBase"
        - type: object
          properties:
            budget_update_project_times:
              type: boolean
              description: |
                this property is used to decide whether existing project times that have been booked to this task should be updated with the changed budget.  If budget_planning type or budget_hourly_rate are set, this property must also be set.   Based on this, the budgets of the existing project times are then recalculated or not.
    TaskBase:
      type: object
      properties:
        name:
          type: string
          nullable: false
        parent_task_id:
          type: string
          description: returns the id of the immediate parent task if the task has one. Use this id when creating or a updating a task in order to locate it at the right place in your task tree.
          nullable: true
        external_id:
          description: Identifier of the corresponding object in an external system. Set and owned by the client.
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        description_external:
          type: string
          nullable: true
        bookable:
          type: boolean
          description: when a task is not bookable, no project times can be booked on it. You need to define child tasks, to book on tasks related to this task.
        billable:
          type: boolean
        project_time_notes_required:
          type: boolean
          description: depending on this property project times booked on this task have to include notes or not
        start_date:
          nullable: true
          description: the task is only available for selection after start_date, however, it can change if a lock_date is set and this is after the start_date. Furthermore, no booking of a project time with date < start or > end is possible.
          allOf:
            - $ref: "#/components/schemas/LocalDate"
        end_date:
          nullable: true
          description: the task is only available for selection before end_date, however, it can change if a lock_date is set and this is before the end_date. Furthermore, no booking of a project time with date < start or > end is possible.
          allOf:
            - $ref: "#/components/schemas/LocalDate"
        lock_date:
          nullable: true
          description: |
            with lock_date property you define a point in time before which existing entries can no longer be changed. This way you ensure that

              * existing entries cannot be changed or deleted
              * no entries can be added later
          allOf:
            - $ref: "#/components/schemas/LocalDate"
        earliest_start_time:
          nullable: true
          description: set this property to limit the task so that it cannot be booked before this time
          allOf:
            - $ref: "#/components/schemas/LocalTime"
        latest_end_time:
          nullable: true
          description: set this property to limit the task so that it cannot be booked after this time
          allOf:
            - $ref: "#/components/schemas/LocalTime"
        budget_planning_type:
          description: |
            when no budget is planned, either don't set this property (on create) or set it to none. set it to inherited to inherit budget settings from parent task.
          allOf:
            - $ref: "#/components/schemas/BudgetPlanningTypeRequest"
        budget_hours_planned:
          type: number
          nullable: true
          description: |
            how many hours were planned in the calculation
            set budget_hours_planned to make timr calculate budget_planned depending on its budget_planning_type:
              * task_hourly_rate: out of budget_hourly_rate and budget_planned
              * user_hourly_rate: out of fixed hours budget (employee budget) and budget_hours_planned
              * fixed_price: out of budget_hourly_rate and budget_planned
        budget_hourly_rate:
          type: number
          nullable: true
          description: |
            depending on its budget_planning_type this property may or may not be set:
              * **task_hourly_rate: this property is necessary to calculate budgets, by default it will be set to 0.00**
              * **user_hourly_rate: this property cannot be set**
              * fixed_price: you can set this property if you want to make timr calculate budget_hours_planned or budget_planned based on its value
        budget_planned:
          type: number
          nullable: true
          description: |
            the price at which the task was sold
            set budget_planned to make timr calculate the budget_hours_planned depending on its budget_planning_type:
              * task_hourly_rate: out of budget_hourly_rate and budget_planned
              * user_hourly_rate: out of fixed hours budget (employee budget) and budget_planned
              * fixed_price: out of budget_hourly_rate and budget_planned
        budget_include_non_billable_project_times:
          type: boolean
          description: set this property to true, if you want to include not billable hours for all project times booked on this task
        location_inherited:
          type: boolean
          description: set this property to false if you want to set a child task's location explicitly instead of inheriting it from its parent
        location:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TaskLocation"
        location_restriction_radius_meters:
          type: integer
          format: int32
          nullable: true
          description: set this property to make recording of project times for this task via the app on the smartphone only possible within this defined geofence radius
        custom_field_1:
          type: string
          nullable: true
          description: you can configure custom fields for tasks in the settings of timr under Administration/Settings/Tasks. To add a new custom field, simply choose a name for the field.
        custom_field_2:
          type: string
          nullable: true
          description: you can configure custom fields for tasks in the settings of timr under Administration/Settings/Tasks. To add a new custom field, simply choose a name for the field.
        custom_field_3:
          type: string
          nullable: true
          description: you can configure custom fields for tasks in the settings of timr under Administration/Settings/Tasks. To add a new custom field, simply choose a name for the field.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    TaskLocation:
      type: object
      description: |
        You can define the location of a task by setting this property. If the task has a parent task, the location is inherited if nothing else is explicitly defined. If you set this property to null, the location will be deleted.
      properties:
        lat:
          description: Latitude in decimal degrees.
          type: number
          format: float
          nullable: true
        lon:
          description: Longitude in decimal degrees.
          type: number
          format: float
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: the country's international country code
          example: AT, DE, ES
      required:
        - lat
        - lon
        - address
        - city
        - zip_code
        - state
        - country
    TasksSortColumn:
      type: string
      description: Sort property for Tasks. `breadcrumbs` orders by the Task's full path, `name` by its own name only.
      enum:
        - breadcrumbs
        - name
    TaskToUserAssignment:
