        id:
          description: Unique identifier. Treat it as an opaque string.
          type: string
          nullable: false
        name:
          type: string
          nullable: false
          example: full-time
      required:
        - id
        - name
    WorkScheduleModel:
      description: |
        The weekday targets a user is measured against: `weeks` holds the layout, `type` selects the calculation mode, and `working_time_rules` the recording constraints.
      allOf:
        - $ref: "#/components/schemas/WorkScheduleModelPartial"
        - type: object
          properties:
            id:
              type: string
              nullable: false
            name:
              type: string
              nullable: false
              example: full-time
            type:
              description: working-time calculation mode (daily_target_hours or normal_working_time); independent from the internal week layout (fixed_week or alternating_weeks)
              nullable: false
              allOf:
                - $ref: "#/components/schemas/WorkScheduleModelType"
            weeks:
              description: |
                for fixed_week models this array contains exactly one week and week_number/name are omitted;  for alternating_weeks models this array contains all configured weeks and each item includes week_number (0-based) and name
              type: array
              items:
                $ref: "#/components/schemas/WorkScheduleModelWeek"
            working_time_rules:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/WorkingTimeRules"
          required:
            - type
            - weeks
            - working_time_rules
    WorkScheduleModelWeek:
      type: object
      properties:
        week_number:
          type: integer
          format: int32
          example: 0
          description: index of the week in alternating_weeks models (0-based); omitted for fixed_week models
          nullable: true
        name:
          type: string
          nullable: true
          example: Week A
          description: display name of the week in alternating_weeks models; omitted for fixed_week models
        target_duration_weekly_minutes:
          type: integer
          format: int64
          example: 2400
          description: value in minutes
        monday:
          $ref: "#/components/schemas/DailyWorkSchedule"
        tuesday:
          $ref: "#/components/schemas/DailyWorkSchedule"
        wednesday:
          $ref: "#/components/schemas/DailyWorkSchedule"
        thursday:
          $ref: "#/components/schemas/DailyWorkSchedule"
        friday:
          $ref: "#/components/schemas/DailyWorkSchedule"
        saturday:
          $ref: "#/components/schemas/DailyWorkSchedule"
        sunday:
          $ref: "#/components/schemas/DailyWorkSchedule"
      required:
        - target_duration_weekly_minutes
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
